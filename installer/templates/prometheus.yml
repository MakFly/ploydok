# ploydok-monitoring-schema: 1
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/ploydok-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ploydok-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/ploydok-secrets/metrics-token
    static_configs:
      - targets: ["api:3335"]
